[package]
name = "example-macro"
version = "0.0.0"
authors.workspace = true
edition = "2021"
description = "Example of using `macro-expander`"
readme.workspace = true
repository.workspace = true
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = "2"

[dependencies.macro-expander]
path = "../macro-expander"
version = "0.1"

[features]
default = ["enable"]
enable = ["macro-expander/enable"]

[lints]
workspace = true
