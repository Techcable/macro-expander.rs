[package]
name = "macro-expander"
version.workspace = true
description = "A proc macro for debugging proc macros, placing output in a file to give precise errors"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
license.workspace = true

[features]
default = ["macro"]
macro = ["dep:macro-expander-macro"]
# Allow expansion to proceed if the environment variable permits it.
# Means the macro depends on the `expander` and `syn` crates.
#
# If this feature is not added, the crate has no dependencies
# and the macro does not validate its input.
enable = [
    "macro",
    "macro-expander-macro/enable",
    "dep:proc-macro2",
    "dep:expander",
    "dep:nanorand",
]
# Forcibly disable expansion,
# regardless of what the environment variables say.
force-disable = []

[dependencies]
quote = "1"
nanorand = { version = "0.8", optional = true }
proc-macro2 = { version = "1", optional = true }

[dependencies.expander]
version = "2"
default-features = false
optional = true

[dependencies.macro-expander-macro]
version = "0.1"
path = "../macro-expander-macro"
optional = true

[build-dependencies]
autocfg = "1.5"
