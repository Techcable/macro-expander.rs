[workspace]
resolver = "2"
members = ["example-macro", "macro-expander", "macro-expander-macro"]

[workspace.package]
version = "0.1.0"
authors = ["Techcable <git@techcable.net>"]
edition = "2021"
rust-version = "1.56"
readme = "README.md"
repository = "https://github.com/Techcable/macro-expander.rs"
license = "MIT OR Apache-2.0"
keywords = ["debug", "expander", "macro", "trace"]
categories = [
    "development-tools",
    "development-tools::debugging",
    "development-tools::procedural-macro-helpers",
]

[workspace.metadata.cargo-reedme]
note = "Do not edit - automatically generated by cargo-reedme"
